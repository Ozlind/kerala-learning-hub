<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <title>You’re offline · Kerala Learning Hub</title>
  <style>
    :root{color-scheme:light;--ink:#253b35;--muted:#66736d;--paper:#f7f7f2;--accent:#d7a45a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    main{width:min(100%,520px);padding:clamp(24px,6vw,48px);border:1px solid #dfe4dc;border-radius:28px;background:#fff;box-shadow:0 16px 48px #253b3510}
    .mark{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:var(--ink);color:white;font-size:26px;font-weight:750}
    h1{margin:28px 0 12px;font-size:clamp(28px,6vw,40px);letter-spacing:-.04em;line-height:1.08}
    p{color:var(--muted);line-height:1.7}
    button{margin-top:16px;min-height:48px;padding:0 20px;border:0;border-radius:14px;background:var(--ink);color:white;font:inherit;font-weight:650;cursor:pointer}
    button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .note{margin-top:24px;padding-top:18px;border-top:1px solid #e8ebe5;font-size:14px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">K</div>
    <h1>Let’s reconnect.</h1>
    <p>You’re offline right now. Your study planner and progress saved on this device are safe. Previously opened lessons may still be available.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <p class="note">When you’re back online, open a lesson once to make its learning content available for a future offline visit.</p>
  </main>
</body>
</html>
